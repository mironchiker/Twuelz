name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Build APK (Optimized for ARM64)
        working-directory: android
        env:
          # Указываем сборщику делать APK только под 64-битные ARM-процессоры (как на твоем Honor)
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          # Выделяем Java 4 ГБ памяти, чтобы компилятор не упал с ошибкой OOM
          _JAVA_OPTIONS: -Xmx4g
        # Флаг --no-daemon убивает фоновые процессы, экономя память на слабом сервере GitHub
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Twuelz-APK
          path: android/app/build/outputs/apk/release/app-release.apk
