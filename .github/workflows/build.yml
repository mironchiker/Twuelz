name: Build Android APK

on:
  workflow_dispatch:

# Критически важно: даем боту GitHub Actions права на создание релизов
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android

      - name: Build APK (ARMv7 & ARM64)
        working-directory: android
        env:
          # Включаем обе архитектуры: старую 32-битную и новую 64-битную
          ORG_GRADLE_PROJECT_reactNativeArchitectures: armeabi-v7a,arm64-v8a
          _JAVA_OPTIONS: -Xmx4g
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        # Переименовываем стандартный app-release.apk, чтобы в релизах он выглядел красиво
        run: mv android/app/build/outputs/apk/release/app-release.apk Twuelz-build-${{ github.run_number }}.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          # Автоматически генерируем уникальные теги на основе номера запуска
          tag_name: "build-${{ github.run_number }}"
          name: "Twuelz Auto-Build #${{ github.run_number }}"
          files: Twuelz-build-${{ github.run_number }}.apk
          body: "Автоматическая ночная сборка Twuelz.\n\nПоддерживаемые архитектуры: `armeabi-v7a`, `arm64-v8a`."
